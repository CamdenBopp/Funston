name: Archive
options:
  bundleIdPrefix: com.camden
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 68Z6A6ACWF
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
  configs:
    Release:
      ENABLE_CODE_COVERAGE: false
      CLANG_COVERAGE_MAPPING: false
packages:
  LNPopupController:
    path: Vendor/LNPopupController
  ArchivePlayerCore:
    url: https://github.com/CamdenBopp/ArchivePlayerCore.git
    from: 0.1.0
targets:
  Archive:
    type: application
    platform: iOS
    sources:
      - path: Archive
    dependencies:
      - package: LNPopupController
        product: LNPopupController-Static
      - package: ArchivePlayerCore
        product: ArchivePlayerCore
      - sdk: libsqlite3.tbd
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camden.Archive
        PRODUCT_NAME: Archive
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Archive/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Archive
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: true
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "9"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - ArchiveTests
        - ArchiveUITests
      gatherCoverageData: true
  ArchiveTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: ArchiveTests
    dependencies:
      - target: Archive
      - package: ArchivePlayerCore
        product: ArchivePlayerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camden.ArchiveTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: ArchiveTests/ArchiveTests-Bridging-Header.h
  ArchiveUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: ArchiveUITests
    dependencies:
      - target: Archive
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camden.ArchiveUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  ArchivePDFPerformance:
    build:
      targets:
        Archive: [test]
    test:
      config: Release
      gatherCoverageData: false
      environmentVariables:
        IA_PDF_PERFORMANCE: "1"
        IA_PDF_PERFORMANCE_MODE: "$(PDF_PERFORMANCE_MODE)"
      commandLineArguments:
        "--skip-playback-restoration": true
      targets:
        - name: ArchiveTests
          selectedTests:
            - PDFRenderingPerformanceTests
