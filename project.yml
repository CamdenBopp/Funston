name: Funston
options:
  bundleIdPrefix: com.camden
  deploymentTarget:
    iOS: "18.0"
  xcodeVersion: "27.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    DEVELOPMENT_TEAM: 68Z6A6ACWF
    ENABLE_USER_SCRIPT_SANDBOXING: true
    ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: true
  configs:
    Release:
      ENABLE_CODE_COVERAGE: false
      CLANG_COVERAGE_MAPPING: false
packages:
  LNPopupController:
    path: Vendor/LNPopupController
  ArchivePlayerCore:
    url: https://github.com/CamdenBopp/ArchivePlayerCore.git
    from: 0.1.0
  Readium:
    url: https://github.com/readium/swift-toolkit.git
    exactVersion: 3.11.0
targets:
  Funston:
    type: application
    platform: iOS
    sources:
      - path: Funston
    dependencies:
      - package: LNPopupController
        product: LNPopupController-Static
      - package: ArchivePlayerCore
        product: ArchivePlayerCore
      - package: Readium
        product: ReadiumShared
      - package: Readium
        product: ReadiumStreamer
      - package: Readium
        product: ReadiumNavigator
      - sdk: libsqlite3.tbd
      - sdk: AVFoundation.framework
      - sdk: MediaPlayer.framework
      - sdk: CarPlay.framework
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camden.Funston
        PRODUCT_NAME: Funston
        GENERATE_INFOPLIST_FILE: true
        INFOPLIST_FILE: Funston/Info.plist
        INFOPLIST_KEY_CFBundleDisplayName: Funston
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.reference
        CODE_SIGN_ENTITLEMENTS: Funston/Funston.entitlements
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        SUPPORTS_MACCATALYST: false
        TARGETED_DEVICE_FAMILY: "1,2"
        MARKETING_VERSION: "0.2.0"
        CURRENT_PROJECT_VERSION: "16"
        CODE_SIGN_STYLE: Automatic
    scheme:
      testTargets:
        - FunstonTests
        - FunstonUITests
      gatherCoverageData: true
  FunstonTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FunstonTests
    dependencies:
      - target: Funston
      - package: ArchivePlayerCore
        product: ArchivePlayerCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camden.FunstonTests
        GENERATE_INFOPLIST_FILE: true
        SWIFT_OBJC_BRIDGING_HEADER: FunstonTests/FunstonTests-Bridging-Header.h
  FunstonUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FunstonUITests
    dependencies:
      - target: Funston
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.camden.FunstonUITests
        GENERATE_INFOPLIST_FILE: true
schemes:
  FunstonPDFPerformance:
    build:
      targets:
        Funston: [test]
    test:
      config: Release
      gatherCoverageData: false
      environmentVariables:
        IA_PDF_PERFORMANCE: "1"
        IA_PDF_PERFORMANCE_MODE: "$(PDF_PERFORMANCE_MODE)"
      commandLineArguments:
        "--skip-playback-restoration": true
      targets:
        - name: FunstonTests
          selectedTests:
            - PDFRenderingPerformanceTests
